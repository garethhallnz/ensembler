<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/favicon-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ensembler</title>
    <script>
      // Apply theme immediately to prevent flash of light mode
      (function() {
        const savedTheme = localStorage.getItem('ensembler-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // savedTheme is 'light' | 'dark' | 'system' | null. 'system' and null follow the OS.
        const dark = savedTheme === 'dark' || ((savedTheme === 'system' || !savedTheme) && systemPrefersDark);

        if (dark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
