name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: When I clicked … I expected … but …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Container runtime
      description: e.g. Docker Desktop 4.x, OrbStack, Podman
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ensembler version
      description: Shown in the app / the release you installed
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant service logs (⋯ menu → View logs) and, if it helps, the
        Settings → Advanced → Diagnostics details. This will be automatically
        formatted as code.
      render: shell
