name: Release

# Push a version tag (e.g. v1.1.0) to build installers for every OS and upload
# them to a GitHub Release. electron-builder creates the release as a DRAFT — review
# the artifacts, then publish it manually. Builds are currently unsigned, so macOS
# users right-click → Open and Windows users choose "More info → Run anyway" once.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # allow the workflow token to create/update the release

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build backend (bundle)
        working-directory: ./backend
        run: npm run build

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # electron-builder builds the target for the current OS (dmg / nsis /
      # AppImage) and uploads it to the draft GitHub Release for this tag.
      - name: Build & publish desktop app
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
