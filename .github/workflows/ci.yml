name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# Cancel previous workflows on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend Testing
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Run backend linting
      working-directory: ./backend
      run: npm run lint
      
    - name: Run backend type checking
      working-directory: ./backend
      run: npm run type-check
      
    - name: Run backend tests with coverage
      working-directory: ./backend
      run: npm run test:coverage
      
    - name: Check backend test coverage
      working-directory: ./backend
      run: |
        npm run test:coverage:check
        echo "Backend test coverage check completed"
        
    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  # Frontend Testing
  frontend-test:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run frontend linting
      working-directory: ./frontend
      run: npm run lint
      
    - name: Run frontend type checking
      working-directory: ./frontend
      run: npm run type-check
      
    - name: Run frontend tests with coverage
      working-directory: ./frontend
      run: npm run test:coverage
      
    - name: Check frontend test coverage
      working-directory: ./frontend
      run: |
        npm run test:coverage:check
        echo "Frontend test coverage check completed"
        
    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

  # E2E Testing
  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps
      
    - name: Build frontend for E2E
      working-directory: ./frontend
      run: npm run build
      
    - name: Run Playwright tests
      working-directory: ./frontend
      run: npm run test:e2e
      
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

  # Build Testing - Cross Platform
  build-test:
    name: Build Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [backend-test, frontend-test]
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build backend
      working-directory: ./backend
      run: npm run build
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      
    - name: Test backend build
      working-directory: ./backend
      run: |
        echo "Testing backend build artifacts..."
        ls -la dist/
        
    - name: Test frontend build
      working-directory: ./frontend
      run: |
        echo "Testing frontend build artifacts..."
        ls -la dist/
        
    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          backend/dist
          frontend/dist
        key: build-${{ matrix.platform }}-${{ github.sha }}
        restore-keys: |
          build-${{ matrix.platform }}-

  # Integration Testing
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    services:
      # Mock Docker service for integration tests
      mock-docker:
        image: docker:dind
        options: --privileged
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Run integration tests
      working-directory: ./backend
      run: npm run test:integration
      env:
        NODE_ENV: test
        DOCKER_HOST: tcp://localhost:2376
        
    - name: Run mocked API tests
      working-directory: ./backend
      run: npm run test:mocked

  # Security & Quality Checks
  security-audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run backend security audit
      working-directory: ./backend
      run: npm audit --audit-level=moderate
      
    - name: Run frontend security audit
      working-directory: ./frontend
      run: npm audit --audit-level=moderate
      
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: javascript
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  # Dependency Check
  dependency-check:
    name: Dependency Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Validate backend package-lock.json
      working-directory: ./backend
      run: |
        npm ci --dry-run
        echo "Backend dependencies validated"
        
    - name: Validate frontend package-lock.json
      working-directory: ./frontend
      run: |
        npm ci --dry-run
        echo "Frontend dependencies validated"
        
    - name: Check for outdated packages
      run: |
        echo "Checking backend outdated packages..."
        cd backend && npm outdated || true
        echo "Checking frontend outdated packages..."
        cd frontend && npm outdated || true

  # Final Status Check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, e2e-test, build-test, integration-test, security-audit, dependency-check]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        echo "Backend tests: ${{ needs.backend-test.result }}"
        echo "Frontend tests: ${{ needs.frontend-test.result }}"
        echo "E2E tests: ${{ needs.e2e-test.result }}"
        echo "Build tests: ${{ needs.build-test.result }}"
        echo "Integration tests: ${{ needs.integration-test.result }}"
        echo "Security audit: ${{ needs.security-audit.result }}"
        echo "Dependency check: ${{ needs.dependency-check.result }}"
        
        if [[ "${{ needs.backend-test.result }}" == "failure" || 
              "${{ needs.frontend-test.result }}" == "failure" || 
              "${{ needs.e2e-test.result }}" == "failure" || 
              "${{ needs.build-test.result }}" == "failure" || 
              "${{ needs.integration-test.result }}" == "failure" ]]; then
          echo "❌ Critical CI jobs failed"
          exit 1
        else
          echo "✅ All critical CI jobs passed"
        fi
        
    - name: Report success
      if: success()
      run: |
        echo "🎉 All CI checks passed successfully!"
        echo "The build is ready for deployment."

# Workflow for automatic dependency updates
  dependency-update:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Check for dependency updates
      run: |
        echo "This job can be extended to automatically create PRs for dependency updates"
        echo "Consider using tools like Dependabot or Renovate for automated dependency management" 