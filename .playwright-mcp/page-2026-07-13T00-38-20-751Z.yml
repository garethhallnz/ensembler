                - paragraph [ref=f15e55]:
                  - text: O Ensembler configura e executa um
                  - strong [ref=f15e56]: centro de mídia doméstico
                  - text: para você — a popular pilha "*arr" (Sonarr, Radarr, Prowlarr e companhia) mais um servidor de mídia como o Plex ou o Jellyfin — sem que você precise conhecer Docker, YAML ou a linha de comando.
                - paragraph [ref=f15e57]: Você escolhe os serviços que deseja, o Ensembler os instala, os inicia, os conecta entre si e lhe oferece um único painel para gerenciar tudo.
                - heading "Como funciona" [level=2] [ref=f15e281]
                - paragraph [ref=f15e59]:
                  - text: Nos bastidores, cada serviço roda em seu próprio
                  - strong [ref=f15e60]: contêiner Docker
                  - text: . O Ensembler gera a configuração do Docker, inicia os contêineres e os conecta uns aos outros para que funcionem como um só sistema. Você nunca precisa mexer em um arquivo de configuração.
                - paragraph [ref=f15e61]: "O percurso típico é:"
                - list [ref=f15e62]:
                  - listitem [ref=f15e63]:
                    - strong [ref=f15e64]: Assistente de configuração
                    - text: — escolha seus serviços, aponte o Ensembler para suas pastas de mídia e clique em
                    - strong [ref=f15e65]: Aplicar
                    - text: . As portas são verificadas para você, e portas livres são escolhidas automaticamente caso uma padrão esteja ocupada.
                  - listitem [ref=f15e66]:
                    - strong [ref=f15e67]: Conexão automática
                    - text: — Sonarr e Radarr recebem seu cliente de download e suas pastas, o Prowlarr se conecta a eles, os servidores de mídia recebem notificações de importação, e assim por diante. Você acompanha cada etapa sendo concluída.
                  - listitem [ref=f15e68]:
                    - strong [ref=f15e69]: Painel
                    - text: "— a partir daí você gerencia tudo em um só lugar: abrir um serviço, iniciá-lo/pará-lo, verificar atualizações ou adicionar mais serviços."
