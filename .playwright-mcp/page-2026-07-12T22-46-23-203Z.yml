          - article [ref=f3e49]:
            - generic [ref=f3e50]:
              - heading "Was ist Ensembler?" [level=1] [ref=f3e51]
              - paragraph [ref=f3e52]:
                - text: Ensembler richtet ein
                - strong [ref=f3e53]: Home Media Center
                - text: für dich ein und betreibt es — den beliebten "*arr"-Stack (Sonarr, Radarr, Prowlarr und Co.) sowie einen Medienserver wie Plex oder Jellyfin — ohne dass du Docker, YAML oder die Kommandozeile kennen musst.
              - paragraph [ref=f3e54]: Du wählst die gewünschten Dienste aus, Ensembler installiert sie, startet sie, verbindet sie miteinander und bietet dir ein einziges Dashboard, um alles zu verwalten.
              - heading "So funktioniert es" [level=2] [ref=f3e55]
              - paragraph [ref=f3e56]:
                - text: Im Hintergrund läuft jeder Dienst in seinem eigenen
                - strong [ref=f3e57]: Docker-Container
                - text: . Ensembler erzeugt die Docker-Konfiguration, startet die Container und verbindet sie miteinander, sodass sie als ein System zusammenarbeiten. Du musst nie eine Konfigurationsdatei anfassen.
              - paragraph [ref=f3e58]: "Der typische Ablauf ist:"
              - list [ref=f3e59]:
                - listitem [ref=f3e60]:
                  - strong [ref=f3e61]: Einrichtungsassistent
                  - text: — wähle deine Dienste, zeige Ensembler deine Medienordner und klicke auf
                  - strong [ref=f3e62]: Anwenden
                  - text: . Ports werden für dich geprüft, und freie Ports werden automatisch gewählt, falls ein Standard belegt ist.
                - listitem [ref=f3e63]:
                  - strong [ref=f3e64]: Automatische Verkabelung
                  - text: — Sonarr und Radarr erhalten ihren Download-Client und ihre Ordner, Prowlarr verknüpft sich mit ihnen, Medienserver bekommen Import-Benachrichtigungen und so weiter. Du siehst, wie jeder Schritt abgeschlossen wird.
                - listitem [ref=f3e65]:
                  - strong [ref=f3e66]: Dashboard
                  - text: "— von da an verwaltest du alles an einem Ort: öffne einen Dienst, starte/stoppe ihn, suche nach Updates oder füge weitere Dienste hinzu."
              - heading "Was die Dienste tun" [level=2] [ref=f3e67]
              - table [ref=f3e69]:
                - rowgroup [ref=f3e70]:
                  - row [ref=f3e71]:
                    - columnheader "Dienst" [ref=f3e72]
                    - columnheader "Rolle" [ref=f3e73]
                - rowgroup [ref=f3e74]:
                  - row [ref=f3e75]:
                    - cell [ref=f3e76]:
                      - strong [ref=f3e77]: Sonarr
                    - cell "Verwaltet deine TV-Serien" [ref=f3e78]
                  - row [ref=f3e79]:
                    - cell [ref=f3e80]:
                      - strong [ref=f3e81]: Radarr
                    - cell "Verwaltet deine Filme" [ref=f3e82]
                  - row [ref=f3e83]:
                    - cell [ref=f3e84]:
                      - strong [ref=f3e85]: Bazarr
                    - cell "Verwaltet Untertitel für Sonarr/Radarr" [ref=f3e86]
                  - row [ref=f3e87]:
                    - cell [ref=f3e88]:
                      - strong [ref=f3e89]: Plex / Jellyfin / Emby
                    - cell "Streamen deine Medien auf deine Geräte" [ref=f3e90]
                  - row [ref=f3e91]:
                    - cell [ref=f3e92]:
                      - strong [ref=f3e93]: Transmission / Deluge
                    - cell "Download-Clients" [ref=f3e94]
                  - row [ref=f3e95]:
                    - cell [ref=f3e96]:
                      - strong [ref=f3e97]: Prowlarr / Jackett
                    - cell "Verwalten, wo deine Dienste nach Inhalten suchen" [ref=f3e98]
                  - row [ref=f3e99]:
                    - cell [ref=f3e100]:
                      - strong [ref=f3e101]: Overseerr
                    - cell "Medien anfragen und entdecken" [ref=f3e102]
              - heading "Was Ensembler tut — und was nicht" [level=2] [ref=f3e103]
              - paragraph [ref=f3e104]:
                - text: Ensembler
                - strong [ref=f3e105]: verbindet deine Dienste miteinander
                - text: . Es wählt, fragt oder lädt
                - strong [ref=f3e106]: keine
                - text: Inhalte aus, und es konfiguriert
                - strong [ref=f3e107]: keine
                - text: Indexer oder Tracker für dich. Du wählst deine eigenen Quellen und bist dafür verantwortlich, wie du sie nutzt.
