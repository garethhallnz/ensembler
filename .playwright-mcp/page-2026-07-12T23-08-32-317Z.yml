              - heading "¿Qué es Ensembler?" [level=1] [ref=f7e51]
              - paragraph [ref=f7e52]:
                - text: Ensembler configura y ejecuta un
                - strong [ref=f7e53]: centro multimedia doméstico
                - text: por ti — el popular stack "*arr" (Sonarr, Radarr, Prowlarr y compañía) junto con un servidor multimedia como Plex o Jellyfin — sin que necesites saber nada de Docker, YAML o la línea de comandos.
              - paragraph [ref=f7e54]: Eliges los servicios que quieres, Ensembler los instala, los inicia, los conecta entre sí y te da un único panel para gestionarlo todo.
              - heading "Cómo funciona" [level=2] [ref=f7e55]
              - paragraph [ref=f7e56]:
                - text: Por debajo, cada servicio se ejecuta en su propio
                - strong [ref=f7e57]: contenedor de Docker
                - text: . Ensembler genera la configuración de Docker, inicia los contenedores y los conecta entre sí para que funcionen como un solo sistema. Nunca tienes que tocar un archivo de configuración.
              - paragraph [ref=f7e58]: "El recorrido habitual es:"
              - list [ref=f7e59]:
                - listitem [ref=f7e60]:
                  - strong [ref=f7e61]: Asistente de configuración
                  - text: — elige tus servicios, indica a Ensembler dónde están tus carpetas de medios y haz clic en
                  - strong [ref=f7e62]: Aplicar
                  - text: . Los puertos se comprueban por ti, y se eligen automáticamente unos libres si alguno por defecto está ocupado.
                - listitem [ref=f7e63]:
                  - strong [ref=f7e64]: Conexión automática
                  - text: — Sonarr y Radarr obtienen su cliente de descargas y sus carpetas, Prowlarr se enlaza con ellos, los servidores multimedia reciben notificaciones de importación, y así sucesivamente. Ves completarse cada paso.
                - listitem [ref=f7e65]:
                  - strong [ref=f7e66]: Panel
                  - text: "— a partir de ahí gestionas todo desde un solo lugar: abre un servicio, inícialo/deténlo, busca actualizaciones o añade más servicios."
              - heading "Qué hacen los servicios" [level=2] [ref=f7e67]
