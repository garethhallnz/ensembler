                      - strong [ref=f7e85]: Bazarr
                    - cell "Gestiona los subtítulos de Sonarr/Radarr" [ref=f7e86]
                  - row [ref=f7e87]:
                    - cell [ref=f7e88]:
                      - strong [ref=f7e89]: Plex / Jellyfin / Emby
                    - cell "Transmiten tus medios a tus dispositivos" [ref=f7e90]
                  - row [ref=f7e91]:
                    - cell [ref=f7e92]:
