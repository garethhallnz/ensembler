                    - cell [ref=f7e100]:
                      - strong [ref=f7e101]: Overseerr
                    - cell "Solicita y descubre medios" [ref=f7e102]
              - heading "Qué hace Ensembler — y qué no hace" [level=2] [ref=f7e103]
              - paragraph [ref=f7e104]:
                - text: Ensembler
                - strong [ref=f7e105]: conecta tus servicios entre sí
                - text: .
                - strong [ref=f7e106]: "No"
                - text: selecciona, solicita ni descarga ningún contenido, y
                - strong [ref=f7e107]: "no"
                - text: configura indexadores ni rastreadores por ti. Tú eliges tus propias fuentes y eres responsable de cómo las usas.
