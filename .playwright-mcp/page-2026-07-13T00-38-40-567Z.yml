            - article [ref=f15e52]:
              - generic [ref=f15e53]:
                - heading "Что такое Ensembler?" [level=1] [ref=f15e335]
                - paragraph [ref=f15e55]:
                  - text: Ensembler настраивает и запускает за вас
                  - strong [ref=f15e56]: домашний медиацентр
                  - text: — популярный стек «*arr» (Sonarr, Radarr, Prowlarr и им подобные) плюс медиасервер, такой как Plex или Jellyfin, — при этом вам не нужно разбираться в Docker, YAML или командной строке.
                - paragraph [ref=f15e57]: Вы выбираете нужные сервисы, Ensembler устанавливает их, запускает, связывает их между собой и даёт единую панель управления для всего.
                - heading "Как это работает" [level=2] [ref=f15e336]
                - paragraph [ref=f15e59]:
                  - text: Под капотом каждый сервис работает в собственном
                  - strong [ref=f15e60]: контейнере Docker
                  - text: . Ensembler генерирует конфигурацию Docker, запускает контейнеры и соединяет их друг с другом, чтобы они работали как единая система. Вам никогда не придётся прикасаться к конфигурационным файлам.
                - paragraph [ref=f15e61]: "Типичный путь выглядит так:"
                - list [ref=f15e62]:
                  - listitem [ref=f15e63]:
                    - strong [ref=f15e64]: Мастер настройки
                    - text: — выберите свои сервисы, укажите Ensembler ваши папки с медиафайлами и нажмите
                    - strong [ref=f15e65]: Применить
                    - text: . Порты проверяются за вас, и если значение по умолчанию занято, свободные порты подбираются автоматически.
                  - listitem [ref=f15e66]:
                    - strong [ref=f15e67]: Автоматическая связка
                    - text: — Sonarr и Radarr получают свой клиент загрузок и папки, Prowlarr подключается к ним, медиасерверы получают уведомления об импорте и так далее. Вы наблюдаете за завершением каждого шага.
                  - listitem [ref=f15e68]:
                    - strong [ref=f15e69]: Панель управления
                    - text: "— с этого момента вы управляете всем из одного места: откройте сервис, запустите/остановите его, проверьте обновления или добавьте новые сервисы."
                - heading "Что делают сервисы" [level=2] [ref=f15e337]
                - table [ref=f15e72]:
                  - rowgroup [ref=f15e73]:
                    - row [ref=f15e338]:
                      - columnheader "Сервис" [ref=f15e339]
                      - columnheader "Роль" [ref=f15e340]
                  - rowgroup [ref=f15e77]:
                    - row [ref=f15e341]:
                      - cell [ref=f15e79]:
                        - strong [ref=f15e80]: Sonarr
                      - cell "Управляет вашими сериалами" [ref=f15e342]
                    - row [ref=f15e343]:
                      - cell [ref=f15e83]:
                        - strong [ref=f15e84]: Radarr
                      - cell "Управляет вашими фильмами" [ref=f15e344]
                    - row [ref=f15e345]:
                      - cell [ref=f15e87]:
                        - strong [ref=f15e88]: Bazarr
                      - cell "Управляет субтитрами для Sonarr/Radarr" [ref=f15e346]
                    - row [ref=f15e347]:
                      - cell [ref=f15e91]:
                        - strong [ref=f15e92]: Plex / Jellyfin / Emby
                      - cell "Транслируют ваши медиафайлы на устройства" [ref=f15e348]
                    - row [ref=f15e349]:
                      - cell [ref=f15e95]:
                        - strong [ref=f15e96]: Transmission / Deluge
                      - cell "Клиенты загрузок" [ref=f15e350]
                    - row [ref=f15e351]:
                      - cell [ref=f15e99]:
                        - strong [ref=f15e100]: Prowlarr / Jackett
                      - cell "Управляют тем, где ваши сервисы ищут контент" [ref=f15e352]
                    - row [ref=f15e353]:
                      - cell [ref=f15e103]:
                        - strong [ref=f15e104]: Overseerr
                      - cell "Запрос и поиск медиафайлов" [ref=f15e354]
                - heading "Что Ensembler делает — и чего не делает" [level=2] [ref=f15e355]
                - paragraph [ref=f15e107]:
                  - text: Ensembler
                  - strong [ref=f15e108]: связывает ваши сервисы между собой
                  - text: . Он
                  - strong [ref=f15e109]: не
                  - text: выбирает, не запрашивает и не загружает какой-либо контент, и он
                  - strong [ref=f15e110]: не
                  - text: настраивает за вас индексаторы или трекеры. Вы выбираете свои собственные источники и сами несёте ответственность за то, как их используете.
        - button "Настройки" [ref=f15e356] [cursor=pointer]
