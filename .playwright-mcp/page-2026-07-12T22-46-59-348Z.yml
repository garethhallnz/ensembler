                    - cell "Manages your movies" [ref=f3e331]
                  - row [ref=f3e332]:
                    - cell [ref=f3e84]:
                      - strong [ref=f3e85]: Bazarr
                    - cell "Manages subtitles for Sonarr/Radarr" [ref=f3e333]
                  - row [ref=f3e334]:
                    - cell [ref=f3e88]:
                      - strong [ref=f3e89]: Plex / Jellyfin / Emby
                    - cell "Stream your media to your devices" [ref=f3e335]
                  - row [ref=f3e336]:
                    - cell [ref=f3e92]:
                      - strong [ref=f3e93]: Transmission / Deluge
                    - cell "Download clients" [ref=f3e337]
                  - row [ref=f3e338]:
                    - cell [ref=f3e96]:
                      - strong [ref=f3e97]: Prowlarr / Jackett
                    - cell "Manage where your services search for content" [ref=f3e339]
                  - row [ref=f3e340]:
                    - cell [ref=f3e100]:
                      - strong [ref=f3e101]: Overseerr
                    - cell "Request and discover media" [ref=f3e341]
              - heading "What Ensembler does — and doesn't do" [level=2] [ref=f3e342]
              - paragraph [ref=f3e104]:
                - text: Ensembler
                - strong [ref=f3e105]: connects your services together
                - text: . It does
                - strong [ref=f3e106]: not
                - text: select, request, or download any content, and it does
                - strong [ref=f3e107]: not
                - text: configure indexers or trackers for you. You choose your own sources and are responsible for how you use them.
