          - article [ref=f3e49]:
            - generic [ref=f3e50]:
              - heading "What is Ensembler?" [level=1] [ref=f3e322]
              - paragraph [ref=f3e52]:
                - text: Ensembler sets up and runs a
                - strong [ref=f3e53]: home media center
                - text: for you — the popular "*arr" stack (Sonarr, Radarr, Prowlarr and friends) plus a media server like Plex or Jellyfin — without you needing to know Docker, YAML, or the command line.
              - paragraph [ref=f3e54]: You pick the services you want, Ensembler installs them, starts them, wires them together, and gives you a single dashboard to manage everything.
              - heading "How it works" [level=2] [ref=f3e323]
              - paragraph [ref=f3e56]:
                - text: Under the hood, each service runs in its own
                - strong [ref=f3e57]: Docker container
                - text: . Ensembler generates the Docker configuration, starts the containers, and connects them to each other so they work as one system. You never have to touch a config file.
              - paragraph [ref=f3e58]: "The typical journey is:"
              - list [ref=f3e59]:
                - listitem [ref=f3e60]:
                  - strong [ref=f3e61]: Setup wizard
                  - text: — choose your services, point Ensembler at your media folders, and click
                  - strong [ref=f3e62]: Apply
                  - text: . Ports are checked for you, and free ones are picked automatically if a default is taken.
                - listitem [ref=f3e63]:
                  - strong [ref=f3e64]: Automatic wiring
                  - text: — Sonarr and Radarr get their download client and folders, Prowlarr links to them, media servers get import notifications, and so on. You watch each step complete.
                - listitem [ref=f3e65]:
                  - strong [ref=f3e66]: Dashboard
                  - text: "— from then on you manage everything from one place: open a service, start/stop it, check for updates, or add more services."
              - heading "What the services do" [level=2] [ref=f3e324]
              - table [ref=f3e69]:
                - rowgroup [ref=f3e70]:
                  - row [ref=f3e325]:
                    - columnheader "Service" [ref=f3e326]
                    - columnheader "Role" [ref=f3e327]
                - rowgroup [ref=f3e74]:
                  - row [ref=f3e328]:
                    - cell [ref=f3e76]:
